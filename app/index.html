<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flashcards</title>

    <!--
      D4: no bundler. The browser resolves the bare specifier `@flashcards/library`
      through this import map. The address is relative to this document, so the same
      map works at the site root and under a project sub-path (GitHub Pages, T-33).

      Requires a real HTTP server — `file://` is not supported (APP-17.6).
    -->
    <script type="importmap">
      {
        "imports": {
          "@flashcards/library": "../library/dist/index.js"
        }
      }
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      /* APP-7.7: the application owns page layout; the library fills the
         container it is given (LIB-7.10). Only this top-level container
         uses a viewport-relative unit — nested wrappers fill it by
         percentage so the invariant holds no matter how deep a view nests
         its own DOM. */
      #app {
        height: 100dvh;
        font-family: system-ui, sans-serif;
      }

      .app-view,
      .deck-view,
      .library-mount {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
