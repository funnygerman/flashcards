<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everything you have seen</title>
    <link rel="stylesheet" href="../src/flashcards.css" />
  </head>
  <body>
    <!-- Optional, per file (see flashcards.css's .fc-credit) — not drawn or
         known about by openDeck()/mount(). -->
    <p class="fc-credit">Made with ♥ by Claude — for <a href="https://t.me/FunnyGerman" target="_blank" rel="noopener">FunnyGerman</a></p>

    <script type="module">
      import { openDeck } from "../src/deck.js";

      /* The dictionary deck (§13): an ordinary deck page, and the only thing
         that makes it the dictionary is that it brings no cards of its own. A
         page with an empty list studies everything the reader has ever opened
         (V2-6.6's groundwork, finally read), across every deck rather than one.

         No list, no table and no filter on purpose: a card is still judged with
         the card in front of the reader, so "one grade per card per day" and
         "paging away settles it" mean exactly what they mean in any other deck,
         without a second implementation to keep in step.

         Reached only by a direct visit — no deck links here any more, since a
         deck with cards of its own switches to the dictionary in place instead
         (V2-13.9). This file is what's left for a reader who arrives with no
         deck open at all, and its own way back to the deck they last opened
         (V2-13.11) is real navigation, computed by openDeck() itself from
         nothing more than an empty card list. */
      openDeck([]);
    </script>
  </body>
</html>
