<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everyday German</title>
    <link rel="stylesheet" href="../src/flashcards.css" />
  </head>
  <body>
    <!-- Optional, per file (see flashcards.css's .fc-credit) — not drawn or
         known about by openDeck()/mount(). -->
    <p class="fc-credit">Made with ♥ by Claude — for <a href="https://t.me/FunnyGerman" target="_blank" rel="noopener">FunnyGerman</a></p>

    <script type="module">
      import { openDeck } from "../src/deck.js";
      import { GERMAN_ARTICLES } from "../src/key.js";

      /* No `key` on any of these: openDeck derives one from the two words on
         the card (V2-2.7), which is exactly what the hand-written keys here
         used to say — `das Wasser`/`water` was, and still is, `wasser-water`.
         Pin one only when a card's text has to change without its identity
         changing with it; numbers-and-time.html has the two cases. */
      const cards = [
        { frontText: "guten Morgen", backText: "good morning", category: "phrase" },
        { frontText: "danke", backText: "thank you", category: "phrase" },
        { frontText: "bitte", backText: "please", backDetails: "also: you're welcome, here you are", category: "phrase" },
        { frontText: "auf Wiedersehen", backText: "goodbye", category: "phrase" },
        { frontText: "sein", frontDetails: "ich bin, du bist", backText: "to be", category: "verb" },
        { frontText: "haben", frontDetails: "ich habe, du hast", backText: "to have", category: "verb" },
        { frontText: "gehen", backText: "to go", category: "verb" },
        { frontText: "laufen", frontDetails: "on foot", backText: "to run", category: "verb" },
        {
          /* Two cards share a front, and the back is what tells them apart —
             which is why a key is derived from both sides, not just one. */
          frontText: "laufen",
          frontDetails: "of a machine",
          backText: "to operate",
          backDetails: "der Motor läuft — the engine is running",
          category: "verb",
        },
        { frontText: "das Haus", backText: "house", category: "noun" },
        { frontText: "das Wasser", backText: "water", category: "noun" },
        { frontText: "das Brot", backText: "bread", category: "noun" },
        { frontText: "das Buch", backText: "book", category: "noun" },
        { frontText: "der Hund", backText: "dog", category: "noun" },
        { frontText: "die Katze", backText: "cat", category: "noun" },
        { frontText: "gut", backText: "good", category: "adjective" },
        { frontText: "schlecht", backText: "bad", category: "adjective" },
        { frontText: "schnell", backText: "fast", backDetails: "also: quick", category: "adjective" },
        { frontText: "langsam", backText: "slow", category: "adjective" },
      ];

      /* Everything else a deck page used to spell out — review scheduling
         through onGrade, the mark restored through gradeOf, the box drawn as a
         row of marks, which cards this sitting asks for, and the switch to the
         dictionary and back — is deck.js's business now. None of it was ever a
         choice this deck made differently from any other, and spelling it out
         per page only gave it room to drift.

         No element is named either: one HTML file is one deck, so the deck is
         the page. */
      /* This deck's front text is German, so a derived key drops a leading
         der/die/das — `das Wasser` files under `wasser-water`, the key that
         was written out here by hand. Said rather than assumed: stripping
         those three words unconditionally would quietly mangle a deck written
         in any other language (V2-2.11). */
      openDeck(cards, { articles: GERMAN_ARTICLES });
    </script>
  </body>
</html>
