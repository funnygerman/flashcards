<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everyday German</title>
    <link rel="stylesheet" href="../src/flashcards.css" />
  </head>
  <body>
    <!-- The one element on the page that is not the card (V2-7.1): a way out of
         this deck and into the dictionary (§13). Outside the mounted deck, so
         input.js never reads a tap on it as a tap on the card. -->
    <a class="fc-corner" href="../dictionary.html" title="Everything you have seen" aria-label="Everything you have seen">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 4.5h14M3 10h14M3 15.5h14" stroke-linecap="round" />
      </svg>
    </a>

    <script type="module">
      import { mount } from "../src/flashcards.js";
      import { BOX_COUNT, gradedToday, recordGrade, reviewState } from "../src/review.js";
      import { chooseSession } from "../src/session.js";
      import { allCards } from "../src/store.js";

      const cards = [
        { key: "guten-morgen-good-morning", frontText: "guten Morgen", backText: "good morning", category: "phrase" },
        { key: "danke-thank-you", frontText: "danke", backText: "thank you", category: "phrase" },
        {
          key: "bitte-please",
          frontText: "bitte",
          backText: "please",
          backDetails: "also: you're welcome, here you are",
          category: "phrase",
        },
        { key: "auf-wiedersehen-goodbye", frontText: "auf Wiedersehen", backText: "goodbye", category: "phrase" },
        { key: "sein-to-be", frontText: "sein", frontDetails: "ich bin, du bist", backText: "to be", category: "verb" },
        { key: "haben-to-have", frontText: "haben", frontDetails: "ich habe, du hast", backText: "to have", category: "verb" },
        { key: "gehen-to-go", frontText: "gehen", backText: "to go", category: "verb" },
        { key: "laufen-to-run", frontText: "laufen", frontDetails: "on foot", backText: "to run", category: "verb" },
        {
          key: "laufen-to-operate",
          frontText: "laufen",
          frontDetails: "of a machine",
          backText: "to operate",
          backDetails: "der Motor läuft — the engine is running",
          category: "verb",
        },
        { key: "haus-house", frontText: "das Haus", backText: "house", category: "noun" },
        { key: "wasser-water", frontText: "das Wasser", backText: "water", category: "noun" },
        { key: "brot-bread", frontText: "das Brot", backText: "bread", category: "noun" },
        { key: "buch-book", frontText: "das Buch", backText: "book", category: "noun" },
        { key: "hund-dog", frontText: "der Hund", backText: "dog", category: "noun" },
        { key: "katze-cat", frontText: "die Katze", backText: "cat", category: "noun" },
        { key: "gut-good", frontText: "gut", backText: "good", category: "adjective" },
        { key: "schlecht-bad", frontText: "schlecht", backText: "bad", category: "adjective" },
        { key: "schnell-fast", frontText: "schnell", backText: "fast", backDetails: "also: quick", category: "adjective" },
        { key: "langsam-slow", frontText: "langsam", backText: "slow", category: "adjective" },
      ];

      /* Review scheduling is not part of the library (V2-5.9) — a deck page
         wires it up itself, through the same onGrade callback any other
         host-side concern would use. The library's `progress` option is
         equally review-agnostic: it just draws N of M dots, so the box being
         the count outright is this deck's own mapping, not the library's.
         One dot per box above the first: box 0 fills none of them, which is
         what a card the reader has never got right should look like, and each
         box above it fills one more, up to a full row for the top box. That is
         as many distinct rows as there are boxes, so every real grade moves
         the display by exactly one dot — a coarser scale could compress two
         different grades into the same count and make one of them look like
         nothing happened. (An earlier version drew seven dots for seven boxes
         as box + 1, which left a card that had never been graded, or had just
         been failed, showing one filled dot: progress where there was none.)

         BOX_COUNT rather than a 5 written out here, so that the ladder in
         review.js stays the only place the number of boxes is decided: change
         it there and this row resizes with it, instead of quietly drawing the
         wrong number of dots until someone notices.

         gradeOf is the other half of that wiring: review.js remembers what
         the reader said about a card today, so a card graded before this page
         was reloaded comes back wearing its mark instead of looking untouched
         — and the library, seeing it arrive already graded, leaves it that
         way. One grade per card per day; changing one's mind is free until
         the card is left behind. */

      /* A deck file with no cards of its own studies the whole dictionary
         instead (§13) — which is all dictionary.html is. This one has cards,
         so the fallback never fires here; it is written the same way in both
         so there is one rule rather than a special case. chooseSession then
         takes what is actually due, most overdue first. */
      const source = cards.length > 0 ? cards : allCards();

      mount(document.body, chooseSession(source), {
        onGrade: (card, level) => recordGrade(card.key, level),
        gradeOf: (card) => gradedToday(card.key),
        progress: {
          steps: BOX_COUNT - 1,
          of: (card) => reviewState(card.key).box,
        },
      });
    </script>
  </body>
</html>
