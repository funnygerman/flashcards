<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Numbers and Time</title>
    <link rel="stylesheet" href="../src/flashcards.css" />
  </head>
  <body>
    <!-- Optional, per file (see flashcards.css's .fc-credit) — not drawn or
         known about by openDeck()/mount(). -->
    <p class="fc-credit">Made with ♥ by Claude — for <a href="https://t.me/FunnyGerman" target="_blank" rel="noopener">FunnyGerman</a></p>

    <script type="module">
      import { openDeck } from "../src/deck.js";

      /* A second deck, on a subject the first one does not touch. Two decks are
         what make the dictionary worth having — one deck's dictionary is that
         deck — and they are what the corner mark is for: it switches in place
         to the dictionary and back, and appears at all only once the other
         deck has been opened. */
      /* Most of these carry no `key`: openDeck derives one from the two words
         on the card (V2-2.7), and for `zwei`/`two` that derivation is
         `zwei-two` — the key that used to be written out here by hand.

         The three that do carry one are the three reasons a card ever should.
         `fuenf-five` predates this deck spelling `fünf` with its umlaut in the
         key at all — derivation now keeps a card's own script rather than
         transliterating it (V2-2.7), so `fünf` would file as `fünf-five`, a
         different card as far as a reader's existing schedule is concerned.
         `hundert-hundred` was keyed before its back text read "a hundred";
         deriving now would file it under `hundert-a-hundred`, the same kind of
         mismatch. Both pins keep the wording free to change without the card's
         identity changing with it. `wie-spaet` is the third reason: a key
         deliberately shorter than the card. Derivation cannot know which words
         of a sentence are the card, and would file this one under the whole of
         both sides — a perfectly good key that no person would ever have
         written. */
      const cards = [
        { frontText: "eins", backText: "one", category: "number" },
        { frontText: "zwei", backText: "two", category: "number" },
        { frontText: "drei", backText: "three", category: "number" },
        { frontText: "vier", backText: "four", category: "number" },
        { key: "fuenf-five", frontText: "fünf", backText: "five", category: "number" },
        { frontText: "zehn", backText: "ten", category: "number" },
        { frontText: "zwanzig", backText: "twenty", category: "number" },
        { key: "hundert-hundred", frontText: "hundert", backText: "a hundred", category: "number" },
        { frontText: "der Montag", backText: "Monday", category: "day" },
        { frontText: "der Mittwoch", backText: "Wednesday", category: "day" },
        { frontText: "der Samstag", backText: "Saturday", backDetails: "also: der Sonnabend", category: "day" },
        { frontText: "der Sonntag", backText: "Sunday", category: "day" },
        { frontText: "heute", backText: "today", category: "time" },
        { frontText: "morgen", frontDetails: "lower case", backText: "tomorrow", backDetails: "der Morgen, capitalised, is the morning", category: "time" },
        { frontText: "gestern", backText: "yesterday", category: "time" },
        { frontText: "jetzt", backText: "now", category: "time" },
        { frontText: "immer", backText: "always", category: "time" },
        { key: "wie-spaet", frontText: "Wie spät ist es?", backText: "What time is it?", category: "phrase" },
      ];

      openDeck(cards);
    </script>
  </body>
</html>
