<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everything you have seen</title>
    <link rel="stylesheet" href="src/flashcards.css" />
  </head>
  <body>
    <!-- Back to the deck. A plain link rather than the browser's history, so it
         works the same whether the reader arrived from the deck or opened this
         page directly. -->
    <a class="fc-corner" href="decks/everyday-german.html" title="Everyday German" aria-label="Everyday German">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <rect x="3.5" y="5" width="13" height="10" />
      </svg>
    </a>

    <script type="module">
      import { mount } from "./src/flashcards.js";
      import { BOX_COUNT, gradedToday, recordGrade, reviewState } from "./src/review.js";
      import { chooseSession } from "./src/session.js";
      import { allCards } from "./src/store.js";

      /* The dictionary deck (§13). This is an ordinary deck page — the same
         library, the same card, the same five intents, the same grading rules —
         and the only thing that makes it the dictionary is that it brings no
         cards of its own. A deck file with an empty list studies everything the
         reader has ever opened (V2-6.6's groundwork, finally read), across every
         deck rather than one.

         There is no list, no table and no filter here on purpose: a card is
         still judged with the card in front of the reader, so "one grade per
         card per day" and "paging away settles it" mean exactly what they mean
         in any other deck, without a second implementation to keep in step. */
      const cards = [];

      const source = cards.length > 0 ? cards : allCards();

      mount(document.body, chooseSession(source), {
        onGrade: (card, level) => recordGrade(card.key, level),
        gradeOf: (card) => gradedToday(card.key),
        progress: {
          steps: BOX_COUNT - 1,
          of: (card) => reviewState(card.key).box,
        },
      });
    </script>
  </body>
</html>
