<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everything you have seen</title>
    <link rel="stylesheet" href="src/flashcards.css" />
  </head>
  <body>
    <script type="module">
      import { lastDeck, openDeck } from "./src/deck.js";

      /* The dictionary deck (§13): an ordinary deck page, and the only thing
         that makes it the dictionary is that it brings no cards of its own. A
         page with an empty list studies everything the reader has ever opened
         (V2-6.6's groundwork, finally read), across every deck rather than one.

         No list, no table and no filter on purpose: a card is still judged with
         the card in front of the reader, so "one grade per card per day" and
         "paging away settles it" mean exactly what they mean in any other deck,
         without a second implementation to keep in step. */
      /* Back to the deck the reader came from. With more than one deck there
         is no such thing as *the* deck to name here, and naming the one they
         last opened is the only answer that stays true as decks are added. It
         is always there when it is needed: a dictionary with nothing in it
         cannot render at all, so if there is something to come back from, some
         deck was opened to put it there. */
      openDeck([], { corner: lastDeck() });
    </script>
  </body>
</html>
