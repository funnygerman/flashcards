<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>@flashcards/library demo</title>

    <!--
      D4: no bundler. The browser resolves the bare specifier `@flashcards/library`
      through this import map, the same pattern app/index.html uses (T-00) — except
      this page is a library-only showcase, with no app or content pipeline behind
      it (T-10's AC13). The address is relative to this document, so it works the
      same at the site root or under a Pages sub-path.
    -->
    <script type="importmap">
      {
        "imports": {
          "@flashcards/library": "../dist/index.js"
        }
      }
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      #deck {
        height: 100dvh;
        font-family: system-ui, sans-serif;
      }

      /* A manual verification aid, not part of the library: the demo counts
         onCardShown callbacks itself and shows the running total, so a quick
         swipe-through on a real phone can be checked against what was
         actually looked at (see the T-10 commit notes). */
      #shown-count {
        position: fixed;
        inset-block-start: 0;
        inset-inline-start: 0;
        z-index: 1;
        padding: 0.35rem 0.6rem;
        font-size: 0.8rem;
        color: #1a1a1a;
        background: rgb(255 255 255 / 85%);
        border-end-end-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="shown-count">Cards shown: 0</div>
    <div id="deck"></div>
    <script type="module" src="./cards.js"></script>
  </body>
</html>
