name: Deploy to GitHub Pages

# v2 needs no build: the sources the browser loads are the ones in the
# repository, copied in as they are. Every push to main publishes, so what is
# on main is what is live — there is no separate release step to forget.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # No build step, so the sources the browser loads are the ones in
          # the repository. The tests are not part of the site.
          cp -r v2 _site/v2
          rm -f _site/v2/src/*.test.js

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./v2/decks/everyday-german.html" />
              <title>Flashcards</title>
            </head>
            <body>
              <p>Redirecting to <a href="./v2/decks/everyday-german.html">the deck</a>…</p>
            </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
