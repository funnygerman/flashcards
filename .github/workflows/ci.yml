name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # library/ and app/ (v1) are being retired: nothing in CI builds or
      # deploys them any more (see deploy.yml). Their lint/typecheck/test
      # coverage stays on as a safety net for as long as they're still in the
      # tree — tsconfig.json resolves @flashcards/library straight to source
      # for typechecking, so none of this needs `npm run build` to have run.
      - run: npm run lint

      - run: npm test
